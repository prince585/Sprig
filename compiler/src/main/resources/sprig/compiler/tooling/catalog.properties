help.language.syntax=import "@std/process.spr" as process |  | func label(celsius: Int) -> String: |     if celsius < 0: |         return "freezing" |     elif celsius < 20: |         return "cool" |     else: |         return "warm" |  | let readings: MutableList[Int] = [] | for line in process.read_lines(): |     let celsius = line.trim().toIntOrNull() |     if celsius == null: |         continue |     readings.append(celsius) | var i = 0 | while i < readings.size(): |     print(readings[i] + "C is " + label(readings[i])) |     i += 1 | print("readings: " + readings.size())
help.language.rules=Top-level statements are the program and run in source order, and a function named main is not called automatically; a block header ends with ':' and its body is indented with spaces, with no braces and no semicolons; else-if is spelled elif; var declares a variable that can be reassigned and let one that cannot, and both need an initial value; every named function declares parameter and result types, with -> Unit when it returns nothing; operators are and, or, not, ==, !=, <, <=, >, >=, +, -, *, % and the assignments =, +=, -=, *=, with no ++ or --; integer / is rejected, use a.divTrunc(b) or convert with toFloat(); built-in functions are print(value), which ends the line, range(stop), range(start, stop) and range(start, stop, step), which return lists of Int (a for loop over range counts without building the list), and assert(condition, message); read standard input with @std/process.spr: read_lines() returns every line, read_line() one line or null at the end, and read_all() the whole text; + with a String on either side joins text, so "total " + total needs no conversion, and a value that may be null is checked first; imports precede declarations; no implicit truthiness; binary operands evaluate left to right exactly once and/or short-circuit; == and != compare numbers, Bool, String, enums, variants, lists and maps by value and class objects by identity, and nullable scalar comparisons are null-safe on the widened common Int/Float/Bool type; more topics: types, strings, collections, numerics, nullability, functions, classes, variants, match, errors and modules
help.language.examples=website/snippets/tutorial/hello.spr
help.types.syntax=let x: Int = 3 | var y = "text" | let maybe: String? = null
help.types.rules=Int is signed 64-bit; Int32 is signed 32-bit; Float is binary64; locals may infer types; no implicit lossy numeric conversion
help.types.examples=website/snippets/variables.spr
help.strings.syntax="A😀東".length() | "A😀東"[1] | "A😀東".charAt(1) | "A😀東".codeAt(1) | "A😀東".substring(1, 2) | "A😀東".indexOf("東") | for c in "A😀東": |     print(c)
help.strings.rules=Sprig has no Char type; an element is a non-null String; length/indexing/charAt/codeAt/substring/indexOf and iteration use Unicode code points, not UTF-16 code units and not grapheme clusters; Java char interop remains a single UTF-16 code unit at the JVM boundary; + with a String on either side joins the other value's text, the same text print shows, so "count " + count needs no toString(); null, a Unit result and a value that may be null (T?) cannot be joined, so check a T? first or give it a fallback with or_else from @std/nulls.spr; a.compareTo(b) is -1, 0 or 1, an Int32, in the order < uses (UTF-16 code units), so fn(a: String, b: String) => a.compareTo(b) is a Java Comparator; a chain evaluates from the left, so 1 + 2 + " then " + 1 + 2 is 3 then 12; @std/text.spr adds pad_left, pad_right (widths in code points) and the ASCII checks is_ascii_digit and is_ascii_letter
help.strings.examples=tests/runtime/20_string_codepoints.spr
help.functions.syntax=func add(a: Int, b: Int) -> Int: |     return a + b | print(add(2, 3))
help.functions.rules=Parameters and return types are explicit; calls use positional arguments; Unit is a result type only; source callable types use fn(A) -> R with zero to three parameters; invariant parameter and result types; nullable callable uses (fn(A) -> R)?; a callable type may declare throws Error after its result, and a lambda that calls a function throwing Error has that clause; a value without the clause is accepted where the clause is expected, never the reverse; a function declared rethrows throws exactly what its callable arguments throw, so a lambda that cannot fail makes an ordinary call
help.functions.examples=website/snippets/functions.spr
help.classes.syntax=class Person: |     let name: String |     let age: Int = 0 | let p = Person(name="Ada")
help.classes.rules=Fields have explicit types; constructors use named arguments; methods may access current-object fields implicitly; a class value is an object, so == is true only for the same object even when every field matches: compare the fields you mean, such as a.id == b.id, or use a variant for a value compared by its contents
help.classes.examples=website/snippets/classes.spr
help.variants.syntax=variant Expr: |     Literal(value: Int) |     Add(left: Expr, right: Expr)
help.variants.rules=Cases have immutable named payloads; construct with Expr.Literal(value=3); cases are closed; == compares the case and its payload by value
help.variants.examples=website/snippets/variants.spr
help.match.syntax=let result = match value: |     case Result.Ok as ok: |         ok.value |     case Result.Error: |         0 | match expr: |     case Expr.Literal as literal: |         print(literal.value) |     case Expr.Add as add: |         print(add.left)
help.match.rules=Expression match has exactly one expression per branch and strict contextual/first-non-null result typing; Unit results use statement match; Statement match keeps multi-statement suites; list every case explicitly; no wildcard or default; case binders have the case payload type
help.match.examples=tests/visitor/ast_visitor.spr
help.nullability.syntax=let value: String? = null | if value != null: |     print(value) | func size(text: String?) -> Int: |     if text == null: |         return 0 |     return text.length()
help.nullability.rules=Only T? admits null; check before dereference; Java reference results are conservatively nullable, so each Java call result needs its own check, except toString(), which is a String; an immutable binding narrows inside if x != null, on the right side of and, and after an early exit such as if x == null: return (or throw, break, continue), at the top level as in a function; a var never narrows, so copy it into a let to check it; @std/nulls.spr adds or_else[T](value, fallback) and require[T](value, message), which throws Error for null
help.nullability.examples=website/snippets/nullable.spr
help.errors.syntax=func checkout(quantity: Int) -> Int throws Error: |     if quantity <= 0: |         throw Error("quantity must be positive") |     return quantity
help.errors.rules=Recoverable errors use throws and typed catch; unhandled checked Java exceptions are diagnosed; a lambda may call a function that throws Error and then has the type fn(A) -> R throws Error; calling such a value needs throws Error or try/catch; only Error crosses a function value, a checked Java exception is handled in a named function; a catch of a checked Java exception that nothing in its try block can throw is SPR-FLOW-CATCH-NEVER-THROWN, and declaring one the body can never throw is SPR-FLOW-THROWS-UNUSED (Exception, Throwable and Error are not checked this way); an Error's text is its message: problem.message, print(problem), "failed: " + problem and problem.toString() all give it, while a caught Java exception shows Java's text, class name first, and its message is a String? because getMessage() may return null; @std/files fails with Error
help.errors.examples=website/snippets/errors.spr
help.collections.syntax=let xs: List[Int] = [1, 2] | let ys = xs.toMutableList()
help.collections.rules=List and Map are read-only; MutableList and MutableMap allow mutation; sort orders Bool or Comparable elements ascending and stably, with Float -0.0 before 0.0 and NaN last; @std/lists.spr adds sorted and sort_by (Comparable), group_by (Equatable key, first-seen order), fold, find, any, all, count, sum and sum_by; @std/nulls.spr or_else gives a missing map entry a fallback value; snapshots are explicit; map reads return Nullable values; compound assignment through a map index requires an existing key and raises Error when the key is missing
help.collections.examples=website/snippets/collections.spr
help.numerics.syntax=let x: Int = 4 | let q = x.divTrunc(2) | let whole = 2.7.toIntTrunc() | let exact = 6.0.toIntExact() | let ratio = x.toFloat()
help.numerics.rules=Int and Int32 arithmetic checks overflow; integer / is rejected, use divTrunc; floating values use IEEE 754; conversions with possible loss require explicit methods; Float to Int: toIntExact() and toInt() fail unless the value is whole, toIntTrunc() drops the fraction and fails outside the Int range; Int to Float: toFloat() and toFloatExact() fail if precision would be lost, toFloatLossy() rounds; there is no built-in rounding method: import java.lang.Math and call Math.round(x), which returns Int; String to Int: toIntOrNull() returns null for text that is not an integer; an overflow fails with ArithmeticException, which catch problem: Error does not catch: check before the operation, or import java.lang.ArithmeticException as ArithmeticException and catch that type; text.fixed(value, decimals) from @std/text.spr prints a Float with that many decimals, rounding half away from zero; at the Java boundary an Int narrows to int/Integer with a run-time range check (SPR-RUNTIME-EXCEPTION outside the Int32 range) while Float never narrows to float
help.numerics.examples=website/snippets/tutorial/numeric_science.spr
help.modules.syntax=import "math.spr" as math | import "@std/files.spr" as files | export math.add
help.modules.rules=Imports precede explicit export alias.Symbol declarations, which precede ordinary declarations/statements; no wildcard/renaming/implicit export; facade names retain defining declaration identity; manifest module export boundaries still apply; File imports are relative to the importing file except reserved @std bundled modules; cycles are rejected; Java class imports use aliases; top-level statements run once, in source order, and cannot use a top-level binding declared below them; code that reaches a binding before its initializer ran fails at runtime; bundled @std modules: process (read_lines, read_line, read_all, arguments, environment, exit, print_error, run), text (split, join, trim, lines, pad_left, pad_right, starts_with, ends_with, strip_prefix, strip_suffix, is_ascii_digit, is_ascii_letter, fixed), lists (sorted, sort_by, group_by, fold, find, any, all, count, sum, sum_by, first, last, take, drop, reversed, distinct, index_of, enumerate, zip), sets, nulls (or_else, require), math (abs, min, max, sign, clamp, floor_div, isqrt), files, json, json_codec, regex, random, dates, time, jvm and test; sprig api @std/text.spr lists a bundled module's functions with their types
help.modules.examples=website/snippets/modules/main.spr
help.jvm.syntax=import java.time.LocalDate as LocalDate | let today = LocalDate.now()
help.jvm.rules=Run sprig api CLASS --json before calling Java; Java methods use positional arguments; reference results may be null, except toString() and results declared non-null by a run-time visible annotation (NotNull/NonNull/Nonnull on the method, or NullMarked/NonNullApi/MethodsReturnNonnullByDefault on its class or package); a parameter annotated Nullable or CheckForNull accepts a T? or null; annotations kept only in class files (org.jetbrains.annotations) are read from the class file; an Int argument narrows to an int/Integer formal (parameters, constructors, varargs elements, plain field writes and callback results) with a run-time range check, and an exact long or widening Object formal is still preferred; Float never narrows to float; Java arrays cross as opaque values with no source array syntax and byte[] has explicit HostBytes helpers; concrete Java generics require explicit Type[Arg] application and inference is unsupported; a wildcard keeps its bound (a List<? extends T> result reads as T, a List<? extends T> parameter takes any List whose element fits T, nothing can be added through ? extends); a varargs parameter takes the trailing arguments (zero is allowed) or one opaque array of its element class, and fixed-arity overloads win; collections adapt explicitly through @std/jvm.spr with no implicit conversion; concrete invariant Fn0..Fn3 signatures accept Sprig callables; a Java functional-interface parameter (Runnable, Comparator, Consumer, Predicate, ...) accepts a Sprig fn value without a throws clause, with exact parameter types and any result for void; raw and wildcard Fn signatures stay unsupported
help.jvm.examples=website/snippets/jvm_interop.spr
help.conform.syntax=import java.lang.Runnable as Runnable | class Task: |     func run() -> Unit: |         print("running") | conform Task to Runnable
help.conform.rules=conform Class to ImportedInterface declares a foreign JVM nominal contract for an existing non-generic class declared in the same module; it defines no methods and performs no adaptation; the checker verifies every supported abstract instance requirement against existing methods by exact name, arity, JVM shapes and permitted checked exceptions, then emits the interface in the class's JVM interface list; the target must be an imported public non-generic non-sealed Java interface; non-null reference parameters are checked at the foreign method entry; unrelated type, generic, nullability, callable and capability semantics are unchanged
help.conform.examples=docs/jvm/conformance.md
help.agents.syntax=sprig build file.spr --emit-java-only -d generated --json | sprig capabilities --json | sprig help match --json | sprig api java.time.LocalDate --member of --json | sprig api src/main.spr --json | sprig api @pkg/module.spr --member Type.member --json | sprig api . --json | sprig check file.spr --json | sprig explain SPR-CODE --json | sprig upgrade --check
help.agents.rules=Query current capabilities before generating syntax; use diagnostics to repair code; do not guess unsupported features; api inspects Java classes and checked Sprig modules/projects with resolved signatures and never executes application code
help.agents.examples=docs/tooling/agent-guide.md
help.generics.syntax=generic T: |     class Box: |         let value: T | generic K, V: |     class Entry: |         let key: K |         let value: V | let box = Box[Int](value=1) | let entry = Entry[String, Int](key="age", value=18)
help.generics.rules=requires clauses must precede every other function statement and nested/forward nullable parameter uses are checked on instantiation; one or more type parameters per generic block (generic K, V:), visible only inside the block; duplicate parameters are rejected; every generic use writes explicit [Type] arguments and there is no inference; generic types are invariant; a bare T has no operators or methods except equality under requires X: Equatable and ordering (< <= > >= and sort) under requires X: Comparable; Comparable type arguments are Int, Int32, Float, Float32, Decimal, BigInt, String or a Comparable type parameter, checked at each call; generic variants use the expanded payload form and Option[Int].Some(value=1)
help.generics.examples=website/snippets/generics.spr
help.projects.syntax=sprig init | sprig project --json | sprig run | sprig run --bin server | sprig check --bin server | sprig check | sprig run explicit.spr
help.projects.rules=--bin selects a [[bin]] for check, build and run; with several bins and no explicit project entry, check without a file checks every bin and build and run require --bin; unknown/duplicate manifest fields and wrong value kinds are rejected; sprig.toml marks a project root and is discovered upward; defaults are source=src and entry=src/main.spr; [[bin]] adds named entries; an explicit .spr file always wins over project discovery, and inside the source root it still uses the locked dependencies; a file and --bin together are an option error; sprig init never overwrites existing files; manifest projects require a current sprig.lock created by sprig resolve; run/check/build refuse a missing or stale lock
help.projects.examples=website/snippets/tutorial/hello.spr
help.dependencies.syntax=[[dependency]] | name = "math" | path = "../math" | [[jvm]] | group = "g" | artifact = "a" | version = "1.0"
help.dependencies.rules=sprig.toml declares local path and Git Sprig dependencies (name is the package-local import alias) and exact-version JVM coordinates; Git supports mutually exclusive branch/tag/full-revision intent and an optional repository-relative subdir; sprig add/remove edit only the selected dependency blocks, preserve other manifest text, resolve immediately through the canonical resolver and publish manifest+lock transactionally; add/remove accept --offline and --json; sprig resolve resolves local/Git Sprig and Maven dependencies into a deterministic sprig.lock; check/build/run reject stale locks and never move Git branches themselves; @alias/module.spr imports must be exported by the dependency; --offline uses verified caches only; Apache Maven Resolver collects exact direct release coordinates and compile/runtime transitives; lock schema 5 records compiler identity, dependency hashes, models, graph and classpath order, and stores owner-relative locators for relative local dependencies (portable) or canonical absolute paths for absolute declarations (not portable); the reserved @std package comes from the installed SDK and is not in the project lock; SDK archive checksums and extracted-archive smoke tests cover published distribution integrity; check/build/run/api/doctor share locked dependencies; no Maven CLI/plugins; only resolve, add and remove resolve dependencies
help.dependencies.syntax=sprig add NAME --path PATH | --git URL [--branch REF|--tag REF|--rev SHA] [--subdir DIR] [--offline] [--json]; sprig add --jvm GROUP:ARTIFACT:VERSION; sprig remove NAME; sprig remove --jvm GROUP:ARTIFACT
help.dependencies.examples=website/snippets/tutorial/hello.spr
help.upgrade.syntax=sprig upgrade --check | sprig upgrade
help.upgrade.rules=Linux/macOS managed SDKs only; --check queries the latest published release without downloading; upgrade verifies the checksum and smoke test before switching; source checkouts and unmanaged SDK ZIPs must use their own update workflow; older managed SDK versions are retained
help.upgrade.examples=docs/projects/install.md
help.testing.syntax=sprig test | sprig test tests/math.spr --filter math | sprig test --classpath build/classes/java/main | sprig test --json | sprig test --offline
help.testing.rules=Tests are ordinary Sprig programs under tests/**/*.spr; each runtime test compiles and runs in its own JVM; compile-fail files under tests/compile_fail require sibling .expect.toml files listing diagnostic codes; --classpath accepts repeated JAR/directory paths or a platform-separated classpath for host Java APIs; @std/test.spr provides check/check_error/finish (named checks that keep going after a failure and end with status 1), temp_dir, argv-based run_process (the same as process.run), and equal_int, equal_bool and equal_text, which throw an Error naming both values when they differ; sprig resolve must produce a current lockfile first
help.testing.examples=examples/test_runner/tests/table_squares.spr

supportedPlatforms=Linux,macOS
experimentalPlatforms=Windows
feature.bundledStd=true
feature.emitJavaOnly=true
feature.foreignConformance=true

feature.formatter=true
feature.wrap=true
help.wrap.syntax=sprig wrap com.example.Client --out client.spr | sprig wrap com.example.Client --member fetch --out client.spr --force --json
help.wrap.rules=Reads the same classpath and project dependencies as sprig api and consumes its shared interop classification; refuses to overwrite an existing file without --force; generated source is ordinary editable Sprig, formatted canonically and checked before it is written; unsupported members are skipped with structured reasons (varargs, wildcards, generic arrays, callable shapes, direct char/Short/Byte parameters); java.util.Optional maps to T?, java.util.List/Map use the explicit @std/jvm.spr adapters, checked exceptions stay in throws declarations; no runtime reflection, dynamic invocation or generator dependency
help.wrap.examples=docs/jvm/wrap.md
help.fmt.syntax=sprig fmt file.spr | sprig fmt . | sprig fmt --check file.spr --json
help.fmt.rules=Canonical deterministic comment-preserving formatting; four spaces per block; no configuration; no aggressive wrapping; explicit command only; parse failures preserve original files
help.fmt.examples=docs/tooling/formatter.md
help.lsp.syntax=sprig lsp | sprig lsp --stdio | sprig lsp --classpath build/classes/java/main
help.lsp.rules=Language Server Protocol over standard input and output, for any LSP client; diagnostics, hover, go to definition, references, document symbols, completion, formatting, rename and quick fixes come from the same parser, resolver and checker as sprig check; a file inside a sprig.toml project uses that project's locked dependencies and classpath, and nothing is resolved or downloaded; unsaved buffers of open files are read instead of the files on disk; when the current text does not parse or resolve, requests return nothing rather than a guess, and the outline keeps the last version that parsed; rename covers local variables and parameters only and is checked by compiling the renamed text; a quick fix is a code action that applies one of the suggestedEdits of a diagnostic under the cursor, computed from the current text, never from diagnostics the client sends; references search the open files and the files of the same project that mention the name; positions use UTF-16 code units, as LSP requires
help.lsp.examples=docs/tooling/lsp.md
